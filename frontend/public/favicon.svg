<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0c0c10"/>
  <g transform="translate(5.12 5.12) scale(0.84)">
  <defs>
    <linearGradient id="g" x1="12" y1="6" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.55" stop-color="#f5a524"/>
      <stop offset="1" stop-color="#ff6a1f"/>
    </linearGradient>
    <mask id="lobes">
      <rect width="64" height="64" fill="#fff"/>
      <g fill="#000">
        <circle id="hollow" cx="32" cy="16.4" r="8.6"/>
        <use href="#hollow" transform="rotate(120 32 32)"/>
        <use href="#hollow" transform="rotate(240 32 32)"/>
        <circle cx="32" cy="32" r="9.2"/>
      </g>
    </mask>
    <mask id="reel">
      <rect width="64" height="64" fill="#fff"/>
      <g fill="#000">
        <circle cx="32" cy="32" r="1.3"/>
        <circle id="window" cx="32" cy="28.4" r="1.35"/>
        <use href="#window" transform="rotate(72 32 32)"/>
        <use href="#window" transform="rotate(144 32 32)"/>
        <use href="#window" transform="rotate(216 32 32)"/>
        <use href="#window" transform="rotate(288 32 32)"/>
      </g>
    </mask>
  </defs>
  <g fill="url(#g)">
    <g mask="url(#lobes)">
      <circle id="lobe" cx="32" cy="20.4" r="11.6"/>
      <use href="#lobe" transform="rotate(120 32 32)"/>
      <use href="#lobe" transform="rotate(240 32 32)"/>
    </g>
    <!-- Film-reel hub at the heart of the hazard mark -->
    <circle cx="32" cy="32" r="6.4" mask="url(#reel)"/>
  </g>
  </g>
</svg>
