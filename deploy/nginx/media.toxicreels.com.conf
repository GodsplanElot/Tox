server {
    listen 443 ssl http2;
    server_name media.toxicreels.com;

    # Configure the certificate paths with the certificate manager used on
    # the Lightsail host before enabling this server block.
    ssl_certificate /etc/letsencrypt/live/media.toxicreels.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.toxicreels.com/privkey.pem;

    client_max_body_size 20G;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:9000;
    }
}
