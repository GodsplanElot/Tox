# Include these directives inside the existing api.toxicreels.com server block.
# Nginx serves approved video downloads directly after Django sets
# X-Accel-Redirect. Requests to video paths from the public internet are denied.

client_max_body_size 20G;
proxy_request_buffering off;
proxy_read_timeout 30m;
proxy_send_timeout 30m;

location ^~ /media/videos/ {
    internal;
    alias /srv/toxicreels/media/videos/;
}

location /media/ {
    alias /srv/toxicreels/media/;
    access_log off;
    expires 7d;
}
